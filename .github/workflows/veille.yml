name: Veille Instagram

on:
  schedule:
    # Каждый понедельник в 10:00 по Бали (UTC+8, без перехода на летнее время) = 02:00 UTC.
    - cron: "0 2 * * 1"
  workflow_dispatch: {}  # кнопка «Run workflow» для ручного запуска

permissions:
  contents: read

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Запустить мониторинг и отправить отчёт
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # необязательно: ИИ-анализ
          # Принимаются оба варианта названий секретов: полные и короткие (TG_…).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TG_CHAT_ID }}
        run: python veille.py
      - name: Сохранить выгрузки (JSON + CSV) на 30 дней
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veille-${{ github.run_number }}
          path: sorties/
          retention-days: 30
          if-no-files-found: ignore
