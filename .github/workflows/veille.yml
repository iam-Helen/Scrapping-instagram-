name: Veille Instagram

on:
  schedule:
    # Каждый понедельник в 7:17 UTC (8–9 утра по Парижу, в зависимости от летнего времени).
    - cron: "17 7 * * 1"
  workflow_dispatch: {}  # кнопка «Run workflow» для ручного запуска

permissions:
  contents: read

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Запустить мониторинг и отправить отчёт
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python veille.py
      - name: Сохранить выгрузки (JSON + CSV) на 30 дней
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veille-${{ github.run_number }}
          path: sorties/
          retention-days: 30
          if-no-files-found: ignore
