name: Сторис и закрепы

on:
  workflow_dispatch: {}  # только ручной запуск

permissions:
  contents: read

jobs:
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Собрать сторис и закрепы
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python stories.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stories-${{ github.run_number }}
          path: sorties/stories/
          retention-days: 30
          if-no-files-found: ignore
