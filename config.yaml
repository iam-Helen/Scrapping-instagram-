# ─────────────────────────────────────────────────────────────
#  Настройки мониторинга Instagram
#  Чтобы изменить, что отслеживается, редактируй только этот файл.
# ─────────────────────────────────────────────────────────────

# Аккаунты для мониторинга: имя пользователя (с @ или без)
# или ссылка на профиль (https://www.instagram.com/имя_аккаунта/).
comptes:
  - yanasy
  - saymyname_regina
  - bartkovskay_psy
  - irinassolo
  - silvo_polina
  - yul.sova.psy
  - earnest.therapy

# Хештеги для мониторинга (без #).
hashtags:
  # - психология
  # - psychology

# Учитывать только публикации за последние X дней.
jours: 7

# Максимальное число публикаций с одного аккаунта / хештега.
posts_par_source: 12

# Сколько публикаций показывать в отчёте Telegram.
top_n: 8

# Лимит расходов Apify за один запуск, в долларах.
# Apify автоматически останавливается, если сумма достигнута.
budget_max_usd: 1.0
